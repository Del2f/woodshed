name: Supabase keep-alive

# 무료 플랜은 7일 동안 요청이 없으면 일시정지된다. 3일마다 가볍게 한 번 깨워 둔다.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' }}
    steps:
      - name: Ping REST API
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/songs?select=id&limit=1" -H "apikey: $KEY")
          echo "HTTP $code"
          test "$code" -lt 500
